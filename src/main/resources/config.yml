# 玩家市场配置。
market:
  max-listings-per-player: 8
  listing-expiry-hours: 168

# 商店范围配置。首次安装可使用 /dirtshop install 命令自动生成。
region:
  require-inside: false

# 预置的 NPC 方便快速体验，请根据需要调整坐标与行为。
npcs:
  shopkeeper:
    name: "&e泥土商贩"
    type: VILLAGER
    world: world
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
    behavior: SHOP
    dialogue:
      - "&a来看看今日的泥土特价！"
  broker:
    name: "&b市场经纪人"
    type: VILLAGER
    world: world
    x: 5.5
    y: 64.0
    z: 0.5
    yaw: 180.0
    pitch: 0.0
    behavior: MARKET
    dialogue:
      - "&f我可以帮你浏览玩家市场。"
