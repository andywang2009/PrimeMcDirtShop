# 泥土商店插件配置

welcome:
  enabled: true
  title: "&6Prime Mc Dirt Shop"
  subtitle: "&f挖掘泥土，打造你的财富！"
  messages:
    - "&a欢迎加入服务器，泥土就是你的第一桶金！"
    - "&e使用 /dirtshop shop 打开默认商店，或挖泥土赚取泥土币。"
    - "&b输入 /dirtshop market browse 查看玩家交易市场。"

# 玩家挖掘下列方块时将获得泥土币，数量可自定义。
dirt-currency:
  fortune-bonus: true
  values:
    DIRT: 1
    GRASS_BLOCK: 1
    COARSE_DIRT: 1
    ROOTED_DIRT: 2
    PODZOL: 2
    MUD: 2
    MUDDY_MANGROVE_ROOTS: 3

# 工具强化配置，默认会在玩家加入服务器时自动应用。
tool-modifiers:
  apply-on-join: true
  items:
    WOODEN_SHOVEL:
      display-name: "&6开垦者木铲"
      lore:
        - "&7挖掘泥土时额外获得 25% 奖励"
      enchantments:
        EFFICIENCY: 1
      durability-multiplier: 0.75
    STONE_SHOVEL:
      display-name: "&6拓荒者石铲"
      lore:
        - "&7稳定的入门工具"
      enchantments:
        EFFICIENCY: 2
      durability-multiplier: 0.7
    IRON_SHOVEL:
      display-name: "&6勤劳铁铲"
      lore:
        - "&7采集泥土时可享受高速奖励"
      enchantments:
        EFFICIENCY: 3
      durability-multiplier: 0.6
    DIAMOND_SHOVEL:
      display-name: "&b尊贵钻石铲"
      lore:
        - "&7泥土币收益 +50%（脚本可进一步扩展）"
      enchantments:
        EFFICIENCY: 4
        UNBREAKING: 2
      durability-multiplier: 0.5
    NETHERITE_SHOVEL:
      display-name: "&d君主下令铲"
      lore:
        - "&7传奇工具：几乎不会损坏"
      enchantments:
        EFFICIENCY: 5
        UNBREAKING: 3
      durability-multiplier: 0.25
      unbreakable: false
    IRON_PICKAXE:
      display-name: "&6泥土商店认证镐"
      lore:
        - "&7矿物类商品在商店中更具价值"
      enchantments:
        EFFICIENCY: 2
      durability-multiplier: 0.7
    DIAMOND_AXE:
      display-name: "&b伐木勇士之斧"
      lore:
        - "&7砍树时提高木材收购效率"
      enchantments:
        EFFICIENCY: 4
      durability-multiplier: 0.6
    SHEARS:
      display-name: "&a柔顺羊毛剪"
      lore:
        - "&7采集羊毛不再损坏工具"
      unbreakable: true
      durability-multiplier: 0.0

